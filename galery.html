<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="index.css">
    <style>
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .gallery-section {
            width: 100%;
            padding: 40px;
        }

        .gallery-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: rgb(0, 0, 0);
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        .gallery-item {
            flex: 1;
            max-width: 300px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-caption {
            background-color: rgb(186, 186, 186);
            text-align: center;
            padding: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: rgb(0, 0, 0);
        }
    </style>
</head>
<body>

    <header>
        <h1>PORTOFOLIO</h1>
        <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="project.html">Project</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="galery.html">Galery</a></li>
        </ul>
    </header>

    <main>
        <section class="gallery-section">
            <h2 class="gallery-title">Gallery</h2>
            <div class="gallery-grid">

                <div class="gallery-item">
                    <img src="gambar10.png" alt="Foto 1">
                    <p class="gallery-caption">Foto 1</p>
                </div>

                <div class="gallery-item">
                    <img src="gambar11.png" alt="Foto 2">
                    <p class="gallery-caption">Foto 2</p>
                </div>

                <div class="gallery-item">
                    <img src="gmabr13.png" alt="Foto 3">
                    <p class="gallery-caption">Foto 3</p>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
